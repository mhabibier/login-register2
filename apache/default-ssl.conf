<VirtualHost *:80>
    # Redirect semua HTTP ke HTTPS
    ServerName localhost
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}:8443$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    # Aktifkan SSL menggunakan sertifikat mkcert
    SSLEngine on
    SSLCertificateFile      /etc/ssl/mkcert/localhost.pem
    SSLCertificateKeyFile   /etc/ssl/mkcert/localhost-key.pem

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    # === ACL: Blokir akses langsung ke file-file sensitif ===
    <FilesMatch "\.(sql|env|log|key|pem|crt|bak|tmp|sh|conf)$">
        Require all denied
    </FilesMatch>

    # === ACL: Folder ssl/ tidak bisa diakses dari browser ===
    <Directory "/var/www/html/ssl">
        Require all denied
    </Directory>

    # === ACL: Folder .git tidak bisa diakses dari browser ===
    <DirectoryMatch "^/var/www/html/\.git">
        Require all denied
    </DirectoryMatch>

    # === ACL: Proteksi auth_check.php dari akses langsung ===
    <Files "auth_check.php">
        Require all denied
    </Files>

    # === ACL: Proteksi database.php dari akses langsung ===
    <Files "database.php">
        Require all denied
    </Files>

    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' cdn.jsdelivr.net cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net cdnjs.cloudflare.com fonts.googleapis.com; font-src 'self' fonts.gstatic.com cdnjs.cloudflare.com; img-src 'self' data:;"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # === ACL: Rate Limiting — Batasi bandwidth per koneksi (anti DoS) ===
    # Maksimal 512 KB/s per koneksi (524288 bytes/s)
    <Location />
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 512
    </Location>

    # === ACL: Blokir Scanner/Bot berbahaya berdasarkan User-Agent ===
    # Blokir tools serangan otomatis: SQLMap, Nikto, Nmap, DirBuster, dll.
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{HTTP_USER_AGENT} (sqlmap|nikto|nmap|dirbuster|gobuster|masscan|wpscan|hydra|burpsuite|metasploit|nessus|openvas|acunetix|havij|w3af) [NC]
        RewriteRule .* - [F,L]
    </IfModule>

    # === ACL: Request Timeout — Proteksi Slowloris ===
    # Header: max 20 detik, min 500 bytes/s
    # Body: max 30 detik, min 500 bytes/s
    <IfModule mod_reqtimeout.c>
        RequestReadTimeout header=20-40,MinRate=500 body=30,MinRate=500
    </IfModule>

    # === ACL: Batasi ukuran request body (max 1MB) ===
    LimitRequestBody 1048576

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

