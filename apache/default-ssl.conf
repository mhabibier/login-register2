<VirtualHost *:80>
    # Redirect semua HTTP ke HTTPS
    ServerName localhost
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}:8443$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    # Aktifkan SSL menggunakan sertifikat mkcert
    SSLEngine on
    SSLCertificateFile      /etc/ssl/mkcert/localhost.pem
    SSLCertificateKeyFile   /etc/ssl/mkcert/localhost-key.pem

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    # === ACL: Blokir akses langsung ke file-file sensitif ===
    <FilesMatch "\.(sql|env|log|key|pem|crt|bak|tmp|sh|conf)$">
        Require all denied
    </FilesMatch>

    # === ACL: Folder ssl/ tidak bisa diakses dari browser ===
    <Directory "/var/www/html/ssl">
        Require all denied
    </Directory>

    # === ACL: Folder .git tidak bisa diakses dari browser ===
    <DirectoryMatch "^/var/www/html/\.git">
        Require all denied
    </DirectoryMatch>

    # === ACL: Proteksi auth_check.php dari akses langsung ===
    <Files "auth_check.php">
        Require all denied
    </Files>

    # === ACL: Proteksi database.php dari akses langsung ===
    <Files "database.php">
        Require all denied
    </Files>

    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' cdn.jsdelivr.net cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net cdnjs.cloudflare.com fonts.googleapis.com; font-src 'self' fonts.gstatic.com cdnjs.cloudflare.com; img-src 'self' data:;"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
