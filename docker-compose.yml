services:

  # ================================================================
  # Container 1: PHP + Apache (Web Application) — HTTPS via mkcert
  # ================================================================
  app:
    build: .
    container_name: argonauth_app_101032300005
    ports:
      - "8080:80"   # HTTP → redirect ke HTTPS
      - "8443:443"  # HTTPS: https://localhost:8443
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html               # Sinkronisasi file project
      - ./ssl:/etc/ssl/mkcert:ro      # Sertifikat mkcert (read-only)
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:443/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # === ACL: Resource Limits — Batasi CPU & RAM ===
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    restart: unless-stopped

  # ================================================================
  # Container 2: MySQL Database (terisolasi di backend_net)
  # ================================================================
  db:
    image: mysql:8.0
    container_name: argonauth_db_101032300005
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: login-register
      MYSQL_USER: user_argon
      MYSQL_PASSWORD: password_argon
    # Port 3306 TIDAK di-expose ke host (ACL jaringan)
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net    # HANYA backend_net — tidak bisa diakses dari frontend
    # === ACL: Resource Limits — Batasi CPU & RAM ===
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: unless-stopped

  # ================================================================
  # Container 3: Snort IDS — Network Intrusion Detection System
  # Monitor semua trafik di frontend_net dan backend_net
  # ================================================================
  snort:
    build:
      context: ./snort
      dockerfile: Dockerfile
    container_name: argonauth_snort_101032300005
    # Butuh NET_ADMIN dan NET_RAW untuk packet capture
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # network_mode host agar Snort bisa sniff semua interface Docker
    network_mode: host
    volumes:
      - snort_logs:/var/log/snort          # Simpan log alert
      - ./snort/snort.conf:/etc/snort/snort.conf:ro
      # Rules TIDAK read-only — agar entrypoint.sh bisa menulis community rules
      # (emerging-threats.rules didownload otomatis saat startup)
      - ./snort/rules:/etc/snort/rules
    # Healthcheck: pastikan proses snort masih berjalan
    healthcheck:
      test: ["CMD", "pgrep", "-x", "snort"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # Beri waktu Snort selesai download ET rules
    labels:
      - "com.argonauth.service=snort-ids"
      - "com.argonauth.nim=101032300005"
    # === ACL: Resource Limits — Batasi CPU & RAM ===
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
    restart: unless-stopped
    depends_on:
      - app
      - db

  # ================================================================
  # Container 4: User/Attacker — Simulasi Client & Pengujian
  # Berisi curl + ping + tools jaringan untuk testing
  # ================================================================
  user:
    image: nicolaka/netshoot
    container_name: argonauth_user_101032300005
    # Tetap hidup agar bisa di-exec
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    networks:
      - frontend_net   # Hanya bisa akses app, tidak ke db
    depends_on:
      - app
    # === ACL: Resource Limits — Batasi CPU & RAM ===
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
    restart: unless-stopped

# ================================================================
# Volumes
# ================================================================
volumes:
  db_data:
    name: argonauth_db_data
  snort_logs:
    name: argonauth_snort_logs

# ================================================================
# Networks — Segmentasi Jaringan (Defense in Depth)
#
#  frontend_net : user ↔ app          (client mengakses web)
#  backend_net  : app  ↔ db           (DB tidak terekspos ke user!)
#  host network : snort               (sniff semua interface)
# ================================================================
networks:
  frontend_net:
    name: argonauth_frontend
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.0.0/24

  backend_net:
    name: argonauth_backend
    driver: bridge
    ipam:
      config:
        - subnet: 192.169.0.0/24
