# ============================================================
# Snort Configuration — ArgonAuth Project (Minimal)
# Snort 2.9.x Ubuntu 22.04 — tanpa preprocessor kompleks
# ============================================================

# ---- Variabel Jaringan ----
var HOME_NET    any
var EXTERNAL_NET any

portvar HTTP_PORTS [80,443,8080,8443]

# ---- Path ----
var RULE_PATH /etc/snort/rules

# ---- Log ----
config logdir: /var/log/snort

# ---- Disable alert decoder bawaan yang noise ----
config disable_decode_alerts
config disable_tcpopt_experimental_alerts
config disable_tcpopt_obsolete_alerts
config disable_tcpopt_ttcp_alerts
config disable_ipopt_alerts

# ---- Output: simpan alert ke file ----
output alert_fast: /var/log/snort/alert.log

# ---- Rules ----
# 1. Rule lokal custom ArgonAuth
include $RULE_PATH/argonauth.rules

# 2. Community rules (didownload saat build image)
# include $RULE_PATH/community.rules
