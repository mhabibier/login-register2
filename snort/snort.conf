# =============================================================
# snort.conf — Konfigurasi ArgonAuth IDS
# Snort 2.9.x | ArgonAuth Kamsis Project
# =============================================================

# ---- Network Variables ----
# Subnet jaringan Docker kita
var HOME_NET [192.168.10.0/24,192.168.20.0/24]
var EXTERNAL_NET any

# Server variables — wajib ada untuk Emerging Threats community rules
ipvar HTTP_SERVERS $HOME_NET
ipvar SQL_SERVERS $HOME_NET
ipvar DNS_SERVERS $HOME_NET
ipvar SMTP_SERVERS $HOME_NET
ipvar TELNET_SERVERS $HOME_NET
ipvar SSH_SERVERS $HOME_NET
ipvar FTP_SERVERS $HOME_NET
ipvar SIP_SERVERS $HOME_NET
ipvar AIM_SERVERS [64.12.24.0/23,64.12.28.0/23,64.12.161.0/24,64.12.163.0/24,64.12.200.0/24,205.188.3.0/24,205.188.5.0/24,205.188.7.0/24,205.188.9.0/24,205.188.153.0/24,205.188.179.0/24,205.188.248.0/24]

# Port HTTP/HTTPS aplikasi
var HTTP_PORTS [80,443,8080,8443]
var HTTPS_PORTS 443
var SSH_PORTS 22
var FTP_PORTS 21
var SIP_PORTS [5060,5061]
var FILE_DATA_PORTS [$HTTP_PORTS,110,143]
var GTP_PORTS [2123,2152,3386]
var ORACLE_PORTS 1521
var MSSQL_PORTS 1433
var DNP3_PORTS 20000
var MODBUS_PORTS 502

# ---- Path Configuration ----
var RULE_PATH           /etc/snort/rules
var COMMUNITY_RULE_PATH /etc/snort/rules
var SO_RULE_PATH        /etc/snort/so_rules
var PREPROC_RULE_PATH   /etc/snort/preproc_rules
var WHITE_LIST_PATH     /etc/snort/rules
var BLACK_LIST_PATH     /etc/snort/rules

# ---- Decoder ----
config disable_decode_alerts
config disable_tcpopt_obsolete_alerts
config disable_tcpopt_ttcp_alerts
config disable_tcpopt_alerts
config disable_ipopt_alerts

# ---- Detection Engine ----
config detection: search-method ac-split search-optimize max-pattern-len 20

# ---- Output ----
# Alert output ditangani oleh CLI (-A fast -l /var/log/snort)
# File alert: /var/log/snort/alert

# Unified2 untuk analisis lanjut (opsional)
# output unified2: filename snort.log, limit 128

# ---- Preprocessors ----
preprocessor frag3_global: max_frags 65536
preprocessor frag3_engine: policy windows detect_anomalies overlap_limit 10 min_fragment_length 100 timeout 180

preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp yes, max_tcp 262144, max_udp 131072, max_active_responses 2, min_response_seconds 5
preprocessor stream5_tcp: log_asymmetric_traffic no, policy windows, detect_anomalies, overlap_limit 10, small_segments 3 bytes 150, timeout 180, ports client 21 22 23 25 42 53 79 109 110 111 113 119 135 136 137 139 143 161 445 513 514 587 593 691 1433 1521 2100 3306 6665 6666 6667 6668 6669 7000, ports both 80 443 8080 8443 8888
preprocessor stream5_udp: timeout 180

preprocessor http_inspect: global iis_unicode_map /etc/snort/unicode.map 1252 compress_depth 65535 decompress_depth 65535
preprocessor http_inspect_server: server default \
    http_methods { GET POST PUT DELETE HEAD OPTIONS PATCH } \
    chunk_length 500000 \
    server_flow_depth 0 \
    client_flow_depth 0 \
    post_depth 65495 \
    oversize_dir_length 500 \
    max_header_length 750 \
    max_headers 100 \
    max_spaces 200 \
    ports { 80 443 8080 8443 }

# ---- Normalizer (DINONAKTIFKAN) ----
# preprocessor normalize_ip4/tcp/icmp4/ip6/icmp6 membutuhkan
# Snort yang di-compile dengan --enable-normalizer.
# Package Snort dari Ubuntu 22.04 TIDAK menyertakan fitur ini.
# Mengaktifkannya menyebabkan Snort crash/gagal start secara diam-diam.

# ---- Classification & Reference ----
# Wajib di-include agar classtype (misc-activity, attempted-dos, dll.) dikenali
include /etc/snort/classification.config
include /etc/snort/reference.config

# ---- Rules ----
# Rule lokal — buatan sendiri (ArgonAuth Kamsis)
include $RULE_PATH/argonauth.rules

# Rule komunitas — Emerging Threats Open Ruleset
# File ini didownload otomatis oleh entrypoint.sh saat container pertama kali start
# Update manual: docker exec argonauth_snort_101032300005 /usr/local/bin/update_rules.sh
include $COMMUNITY_RULE_PATH/emerging-threats.rules
