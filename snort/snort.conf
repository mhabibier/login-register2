# ============================================================
# Snort Configuration — ArgonAuth Project
# Keamanan Sistem | Tel-U
# ============================================================

# ---- NETWORK VARIABLES ----
# Jaringan internal Docker yang dimonitor
var HOME_NET    172.18.0.0/16
var EXTERNAL_NET !$HOME_NET

# Port yang dimonitor
portvar HTTP_PORTS  [80,443,8080,8443]
portvar SSH_PORTS   22

# ---- PATH CONFIGURATION ----
var RULE_PATH        /etc/snort/rules
var SO_RULE_PATH     /usr/local/lib/snort_dynamicrules
var PREPROC_RULE_PATH /etc/snort/rules

# ---- LOG CONFIGURATION ----
config logdir: /var/log/snort

# ---- DECODER ----
config disable_decode_alerts
config disable_tcpopt_experimental_alerts
config disable_tcpopt_obsolete_alerts
config disable_tcpopt_ttcp_alerts

# ---- PREPROCESSORS ----

# HTTP Inspector — decode HTTP traffic untuk mendeteksi serangan di layer aplikasi
preprocessor http_inspect: global \
    iis_unicode_map /etc/snort/unicode.map 1252 \
    compress_depth 65535 \
    decompress_depth 65535

preprocessor http_inspect_server: server default \
    http_methods { GET POST PUT DELETE HEAD OPTIONS TRACE } \
    profile all \
    ports { 80 443 8080 8443 } \
    server_flow_depth 0 \
    client_flow_depth 0 \
    post_depth -1 \
    oversize_dir_length 500 \
    max_header_length 750 \
    max_headers 100 \
    no_alerts \
    normalize_utf \
    normalize_javascript \
    xff_headers { X-Forwarded-For True-Client-IP }

# FTP/Telnet Preprocessor (nonaktifkan jika tidak dipakai)
preprocessor ftp_telnet: global \
    inspection_type stateful \
    encrypted_transfers \
    check_encrypted

preprocessor ftp_telnet_protocol: telnet \
    ayt_attack_thresh 20 \
    normalize \
    detect_anomalies

preprocessor ftp_telnet_protocol: ftp server default \
    def_max_param_len 100 \
    ports { 21 2100 3535 }

# Stream reassembly untuk TCP
preprocessor stream5_global: \
    track_tcp yes, \
    track_udp yes, \
    track_icmp no, \
    max_tcp 262144, \
    max_udp 131072, \
    max_active_responses 2, \
    min_response_seconds 5

preprocessor stream5_tcp: \
    log_asymmetric_traffic no, \
    session_timeout 30, \
    policy windows, \
    detect_anomalies, \
    require_3whs 180, \
    overlap_limit 10, \
    small_segments 3 bytes 150, \
    timeout 30, \
    ports client 21 22 23 25 42 53 70 79 109 110 111 113 119 135 136 137 139 143 \
                 161 210 389 427 443 445 465 513 514 515 543 544 587 593 631 636 \
                 706 993 995 1433 1521 1741 2100 3110 3306 3389 8080 8443

# ---- OUTPUT PLUGINS ----

# Alert cepat ke file (paling ringan untuk container)
output alert_fast: /var/log/snort/alert.log

# Simpan juga dalam format unified2 (bisa dibaca tools seperti Barnyard2)
# output unified2: filename snort.log, limit 128

# ---- INCLUDE RULES ----

# Custom rules ArgonAuth
include $RULE_PATH/argonauth.rules

# ---- SUPPRESS FALSE POSITIVES (opsional) ----
# suppress gen_id 1, sig_id 2100498  # contoh suppress rule tertentu
