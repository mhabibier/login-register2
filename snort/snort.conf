# ============================================================
# Snort Configuration — ArgonAuth Project (Simplified)
# Kompatibel dengan Snort 2.9.x dari Ubuntu 22.04 apt
# ============================================================

# ---- NETWORK VARIABLES ----
var HOME_NET    any
var EXTERNAL_NET any

# ---- PORT VARIABLES ----
portvar HTTP_PORTS [80,443,8080,8443]

# ---- PATH CONFIGURATION ----
var RULE_PATH /etc/snort/rules

# ---- LOG CONFIGURATION ----
config logdir: /var/log/snort

# ---- DECODER (nonaktifkan alert yang tidak perlu) ----
config disable_decode_alerts
config disable_tcpopt_experimental_alerts
config disable_tcpopt_obsolete_alerts
config disable_tcpopt_ttcp_alerts

# ---- PREPROCESSORS (versi minimal) ----

# Stream TCP reassembly (wajib untuk content matching)
preprocessor stream5_global: \
    track_tcp yes, \
    track_udp no, \
    track_icmp no

preprocessor stream5_tcp: \
    policy windows, \
    session_timeout 30

# HTTP Inspector (versi minimal tanpa 'profile')
preprocessor http_inspect: global \
    iis_unicode_map /etc/snort/unicode.map 1252

preprocessor http_inspect_server: server default \
    port 80 443 8080 8443 \
    oversize_dir_length 500

# ---- OUTPUT ----
output alert_fast: /var/log/snort/alert.log

# ---- RULES ----
include $RULE_PATH/argonauth.rules
